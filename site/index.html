<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint so there's no flash of the wrong one.
         Mirrors resolveInitialTheme(): explicit stored choice wins, else the OS
         `prefers-color-scheme`. Kept inline + dependency-free on purpose. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Triangle Weekend — Events in the Raleigh / Triangle Metro</title>
    <meta
      name="description"
      content="A fresh, weekly-curated guide to events across Raleigh, Durham, Chapel Hill, Cary and the Triangle ring — with maps, filters, itineraries, and a subscribable calendar."
    />
    <meta property="og:title" content="Triangle Weekend" />
    <meta property="og:description" content="This week's events across the Raleigh / Triangle metro." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
